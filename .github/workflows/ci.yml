name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool reports on paths and shell commands, so the two platforms where
        # those differ are both part of the contract, not a nicety.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite
        run: python -m unittest discover -s tests -v

  smoke:
    name: smoke - dry-run the fixtures end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: A followable runbook exits 0
        run: python -m runbook_dry_run tests/fixtures/good.md --base-dir . --execute

      # The negative half. Without it the smoke job passes on a checker that has
      # been accidentally turned into a no-op, which is the failure this whole
      # project exists to catch.
      - name: An unfollowable runbook exits 1
        run: |
          set +e
          python -m runbook_dry_run tests/fixtures/bad-path.md --base-dir .
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from a defective runbook, got $code"
            exit 1
          fi

      - name: A destructive step leaves no trace
        run: |
          python -m runbook_dry_run tests/fixtures/destructive.md --base-dir . --execute
          if [ -f destructive-marker.tmp ]; then
            echo "a destructive step was executed during a dry run"
            exit 1
          fi

      # The positive half of the same assertion. A command the checker claims to have
      # run must leave proof, or "exit 0" is indistinguishable from a directive the
      # parser silently dropped - a clean report produced by not looking.
      - name: An expected failure is satisfied, and the command really ran
        run: |
          python -m runbook_dry_run tests/fixtures/expect-fail.md --base-dir . --execute
          if [ ! -f expect-fail-marker.tmp ]; then
            echo "the expect-fail command never ran, so its clean report means nothing"
            exit 1
          fi
          rm -f expect-fail-marker.tmp

      - name: A step gated on a human is reported, not executed
        run: |
          python -m runbook_dry_run tests/fixtures/manual-gate.md --base-dir . --execute
          if [ -f manual-gate-marker.tmp ]; then
            echo "a gated step ran before the manual step it was waiting on"
            exit 1
          fi

      - name: A gate naming a step that does not exist exits 1
        run: |
          set +e
          python -m runbook_dry_run tests/fixtures/bad-manual-gate.md --base-dir .
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from an unresolved manual gate, got $code"
            exit 1
          fi

      - name: A declared shell runs the commands, and they really ran
        run: |
          python -m runbook_dry_run tests/fixtures/shell-bash.md --base-dir . --execute
          if [ ! -f shell-bash-marker.tmp ]; then
            echo "the declared-shell commands never ran, so their clean report means nothing"
            exit 1
          fi
          rm -f shell-bash-marker.tmp

      - name: An unresolved shell exits 1 and runs nothing
        run: |
          set +e
          python -m runbook_dry_run tests/fixtures/shell-unknown.md --base-dir . --execute
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from an unresolved shell, got $code"
            exit 1
          fi
          if [ -f shell-unknown-marker.tmp ]; then
            echo "a command ran under a shell that could not be resolved"
            exit 1
          fi
